name: Demo GIF

# Run by hand (Actions > Demo GIF > Run workflow) to redraw docs/demo.gif from docs/demo.tape.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: charmbracelet/vhs-action@v2.1.1
        with:
          path: docs/demo.tape
      - name: Commit the GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/demo.gif
          git diff --cached --quiet || git commit -m "Update demo GIF"
          git push
