name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runners don't start for this private repository; they join once it is public
        os: ${{ github.event.repository.private && fromJSON('["ubuntu-latest","windows-latest"]') || fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Build and smoke test
        shell: bash
        run: |
          bun run build
          ./bin/asc-payout --version
          ./bin/asc-payout demo --account all --month 2026-10 > /dev/null
