name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runs in its own workflow (macos.yml), so a long queue there never fails this one
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Build and smoke test
        shell: bash
        run: |
          bun run build
          ./bin/asc-payout --version
          ./bin/asc-payout demo --account all --month 2026-10 > /dev/null
